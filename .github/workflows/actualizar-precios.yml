name: Actualizar precios

on:
  schedule:
    # Horarios en UTC. El cierre de NYSE/NASDAQ es 20:00 UTC (verano) o
    # 21:00 UTC (invierno); Tiingo deja los datos firmes cerca de 22:30 UTC.
    # La lista actual (43 tickers) entra completa en una corrida: el plan
    # gratis de Tiingo permite 50 requests por hora. La segunda corrida es
    # el repechaje: solo toca los tickers que quedaron pendientes o fallaron.
    - cron: "0 23 * * 1-5"   # lunes a viernes, 19:00/20:00 hora de Chile
    - cron: "0 1 * * 2-6"    # dos horas despues, por si algo fallo
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Rebajar todo el historico desde cero"
        type: boolean
        default: false
      max_tiingo:
        description: "Tope de requests a Tiingo en esta corrida"
        default: "45"

concurrency:
  group: actualizar-precios
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Descargar precios
        env:
          TIINGO_TOKEN: ${{ secrets.TIINGO_TOKEN }}
          FULL_REFRESH: ${{ inputs.full_refresh && '1' || '0' }}
          MAX_TIINGO: ${{ inputs.max_tiingo || '45' }}
        run: python actualizar_precios.py

      # Los indicadores se recalculan siempre, aunque no haya precios nuevos:
      # asi nunca quedan desfasados respecto de la base.
      - name: Calcular indicadores
        run: python indicadores.py --generar

      - name: Guardar cambios en el repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data estado.json indicadores
          if git diff --staged --quiet; then
            echo "Sin cambios que guardar."
          else
            git commit -m "Precios al $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash
            git push
          fi
